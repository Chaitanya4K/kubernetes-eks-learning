apiVersion: v1
kind: Namespace
metadata:
  name: java-dev-ns

---
apiVersion: v1
kind: Pod
metadata:
  name: javawebpod
  namespace: java-dev-ns
  labels:
    app: javawebapp
spec:
  containers:
    - name: javawebcontainer
      image: chaitanya4k/java-web-app
      ports:
        - containerPort: 8080
