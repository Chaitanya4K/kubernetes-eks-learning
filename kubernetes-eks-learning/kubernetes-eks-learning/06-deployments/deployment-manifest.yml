apiVersion: apps/v1
kind: Deployment
metadata:
  name: javaweb-deployment
  namespace: java-dev-ns
spec:
  replicas: 2
  selector:
    matchLabels:
      app: javawebapp
  template:
    metadata:
      labels:
        app: javawebapp
    spec:
      containers:
        - name: javawebcontainer
          image: chaitanya4k/java-web-app
          ports:
            - containerPort: 8080
